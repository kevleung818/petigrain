<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetigrainProHealth.com</title>
  <meta name="description" content="PetigrainProHealth.com is currently under progress.">
  <style>
    :root {
      color-scheme: light;
      --ink: #283122;
      --muted: #667257;
      --paper: #f5f2e9;
      --line: rgba(40, 49, 34, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 20% 12%, rgba(194, 132, 52, 0.22), transparent 28rem),
        radial-gradient(circle at 82% 88%, rgba(141, 160, 109, 0.35), transparent 30rem),
        linear-gradient(135deg, #efe8d8 0%, var(--paper) 52%, #dfe6d2 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 760px);
      display: grid;
      justify-items: center;
      gap: 28px;
      text-align: center;
    }

    .art {
      width: min(100%, 360px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #9dad79;
      box-shadow: 0 22px 55px rgba(40, 49, 34, 0.18);
    }

    .art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .message {
      display: grid;
      justify-items: center;
      gap: 10px;
      line-height: 1.08;
    }

    h1,
    p,
    figure {
      margin: 0;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 5.2rem);
      font-weight: 700;
      letter-spacing: 0;
    }

    .chinese {
      font-family: "Songti TC", "Noto Serif CJK TC", Georgia, serif;
      font-size: clamp(1.8rem, 6vw, 4rem);
      font-weight: 700;
    }

    .domain {
      margin-top: 8px;
      color: var(--muted);
      font-family: Optima, "Trebuchet MS", sans-serif;
      font-size: clamp(1.15rem, 3vw, 1.75rem);
      letter-spacing: 0;
    }

    @media (max-width: 520px) {
      body {
        padding: 22px;
      }

      main {
        gap: 22px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="PetigrainProHealth.com holding page">
    <figure class="art" aria-label="Petigrain artwork">
      <img src="Untitled site - Google Sites_files/unnamed.jpg" alt="Petigrain illustration">
    </figure>

    <section class="message" aria-label="Site status">
      <h1>Website Under Progress</h1>
      <p class="chinese" lang="zh-Hant">網站建置中</p>
      <p class="domain">PetigrainProHealth.com</p>
    </section>
  </main>
</body>
</html>
